# =============================================================================
# Velvet · AWS 生产 docker-compose（莫凡 ap-east-1 配置 · 2026-04-29 · v2）
# =============================================================================
# 架构：
#   - 容器内：仅 backend（Spring Boot 3.5 / JDK 21）
#   - 宿主机：nginx + certbot（apt install · 不放 docker，方便配多域名 / 证书）
#   - 数据层：MySQL / Redis / Kafka / S3 全部 AWS 托管
#
# 用法：
#   1. cp .env.example .env && vi .env       （填莫凡的真实密钥）
#   2. docker compose -f docker-compose.aws.yml up -d
#   3. 宿主机 nginx 配置见 NGINX_HOST_SETUP.md
# =============================================================================
version: "3.9"

services:
  # ──────────────────────────────────────────────────────────────────────
  # Velvet Backend (Spring Boot 3.5 / JDK 21)
  # 直连：AWS RDS MySQL 8.4.7 / ElastiCache Redis Serverless / MSK Kafka / S3
  # ──────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: velvet-backend:aws
    container_name: velvet-backend
    restart: unless-stopped
    environment:
      # ── 端口 ────────────────────────────────────────────────────
      PORT: 8080

      # ── MySQL (AWS RDS) ─────────────────────────────────────────
      DB_URL: ${DB_URL:?DB_URL required (AWS RDS endpoint)}
      DB_USER: ${DB_USER:?DB_USER required}
      DB_PASS: ${DB_PASS:?DB_PASS required}

      # ── Redis (ElastiCache Serverless · TLS) ────────────────────
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASS:-}
      REDIS_SSL: ${REDIS_SSL:-true}

      # ── Kafka (MSK Serverless · IAM auth) ───────────────────────
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS required}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_SSL}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-AWS_MSK_IAM}
      KAFKA_SASL_JAAS_CONFIG: ${KAFKA_SASL_JAAS_CONFIG:-software.amazon.msk.auth.iam.IAMLoginModule required;}
      KAFKA_SASL_CALLBACK: ${KAFKA_SASL_CALLBACK:-software.amazon.msk.auth.iam.IAMClientCallbackHandler}

      # ── AWS 凭证（给 MSK IAM 用，也给 S3 用，二选一）─────────────
      # 如果 EC2 挂了 IAM Role，下面两个变量留空即可（自动从 IMDSv2 取）
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-east-1}

      # ── S3 ──────────────────────────────────────────────────────
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET required}
      S3_REGION: ${S3_REGION:-ap-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.ap-east-1.amazonaws.com}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}

      # ── JWT / 安全 ──────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (>=64 chars random)}
      JWT_ACCESS_EXP_HOURS: ${JWT_ACCESS_EXP_HOURS:-2}
      JWT_REFRESH_EXP_DAYS: ${JWT_REFRESH_EXP_DAYS:-30}

      # ── 业务配置 ─────────────────────────────────────────────────
      VELVET_CORS_EXTRA: ${VELVET_CORS_EXTRA:-}
      VELVET_CORS_ALLOW_LOCALHOST: "false"
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN required}
      PAYMENT_NOTIFY_BASE_URL: ${PAYMENT_NOTIFY_BASE_URL:?PAYMENT_NOTIFY_BASE_URL required}

      # ── Apple Sign In（登录）── 只校验 audience · 走 Apple JWKS 公钥 ──
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:?APPLE_BUNDLE_ID required (必须等于 iOS PRODUCT_BUNDLE_IDENTIFIER)}
      APPLE_VERIFY_AUDIENCE: ${APPLE_VERIFY_AUDIENCE:-true}

      # ── Apple IAP（应用内购买回调验签）── 当前未启用 · 上线 IAP 时填齐 ──
      # APPLE_IAP_BUNDLE_ID 与 APPLE_BUNDLE_ID 通常一致
      APPLE_IAP_BUNDLE_ID: ${APPLE_IAP_BUNDLE_ID:-${APPLE_BUNDLE_ID}}
      APPLE_IAP_KEY_ID: ${APPLE_IAP_KEY_ID:-}
      APPLE_IAP_ISSUER_ID: ${APPLE_IAP_ISSUER_ID:-}
      # .p8 私钥文件路径（容器内）· 通过 volume 挂载 host 的 ./secrets 目录
      APPLE_IAP_PRIVATE_KEY_P8_PATH: ${APPLE_IAP_PRIVATE_KEY_P8_PATH:-}
      APPLE_IAP_ENVIRONMENT: ${APPLE_IAP_ENVIRONMENT:-sandbox}

      # ── JVM ────────────────────────────────────────────────────
      JAVA_TOOL_OPTIONS: >-
        -Xms512m -Xmx1024m
        -XX:+UseG1GC
        -XX:+ExitOnOutOfMemoryError
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Shanghai

      # ── 日志 ───────────────────────────────────────────────────
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}
      LOGGING_LEVEL_COM_VELVET: DEBUG
    networks:
      - velvet-net
    volumes:
      # Apple IAP 私钥 .p8 / 其他敏感凭证 · 600 权限 · gitignore 已排除
      - ./secrets:/app/secrets:ro
    ports:
      # 仅绑 loopback · 不暴露公网 · 给宿主机 nginx 反代用
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s    # 等 Flyway V1~V15 跑完
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

# nginx 和 certbot 已迁出容器，跑在宿主机 · 见 NGINX_HOST_SETUP.md

networks:
  velvet-net:
    driver: bridge
    name: velvet-net
