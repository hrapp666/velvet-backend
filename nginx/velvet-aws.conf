# =============================================================================
# Velvet · Nginx 反向代理（莫凡 AWS 部署版 · 2026-04-29）
# =============================================================================
# 适用场景：
#   - EC2 (ap-east-1) 上 docker compose 跑 backend (Spring Boot 3.5 / 8080)
#   - 静态资源 / 头像 / 图片直接走 AWS S3（virtual-hosted 域名），不经 nginx
#   - Redis / Kafka / MySQL 全部 AWS 托管，应用直连 endpoint
# 用法：
#   1. cp nginx/velvet-aws.conf nginx/velvet.conf  （或直接改这个文件）
#   2. sed -i 's/api.your-domain.com/api.实际域名/g' nginx/velvet.conf
#   3. docker compose up -d nginx
#   4. docker compose run --rm certbot certonly --webroot \
#         --webroot-path=/var/www/certbot -d api.实际域名 ...
#   5. docker compose restart nginx
# =============================================================================

# ── 限流区（防爆破登录 / 短信刷接口） ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ── upstream ───────────────────────────────────────────────────────────────
upstream velvet_backend {
    server backend:8080;
    keepalive 32;
}

# ── HTTP → HTTPS + ACME challenge ─────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── api.your-domain.com → Spring Boot ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name api.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # 安全 headers（Velvet 渗透测试 H-02 教训）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # body 上限：moment 图文 / 头像 / 单文件 audio
    client_max_body_size 50M;
    client_body_timeout  60s;
    client_header_timeout 30s;

    # 通用连接数限流
    limit_conn conn_zone 50;

    # gzip
    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ── WebSocket（聊天） ──────────────────────────────────────────────
    location /ws {
        proxy_pass http://velvet_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 苹果支付回调（StoreKit notify）── 不限流，必须放过 ────────────
    location ~ ^/api/v1/payment/(apple|notify) {
        proxy_pass http://velvet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── 登录 / 注册 / 短信（防爆破）───────────────────────────────────
    location ~ ^/api/v1/auth/(login|register|send-code|reset-password) {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://velvet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── Apple Sign In 回调（不能限流，苹果重试无规律） ────────────────
    location = /api/v1/auth/apple {
        proxy_pass http://velvet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── actuator 仅本机（安全） ──────────────────────────────────────
    location /actuator {
        allow 127.0.0.1;
        allow 172.16.0.0/12;   # docker 内网
        deny  all;
        proxy_pass http://velvet_backend;
        proxy_set_header Host $host;
    }

    # ── 健康检查（公开，不限流）──────────────────────────────────────
    location = /api/v1/health {
        proxy_pass http://velvet_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── 通用 API ─────────────────────────────────────────────────────
    location / {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://velvet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
    }

    # 隐藏 nginx 版本
    server_tokens off;

    # 标准错误页（不泄露 backend 错误细节）
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '{"code":503,"message":"service temporarily unavailable"}';
        default_type application/json;
    }
}
